name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: stage tarball
        run: scripts/mkstage.sh serpens-stage-x86_64.tar.gz

      - name: artifacts
        run: |
          cp target/release/flexura flexura-x86_64-linux
          cp target/release/ebuild2flx ebuild2flx-x86_64-linux
          sha256sum serpens-stage-x86_64.tar.gz flexura-x86_64-linux ebuild2flx-x86_64-linux > sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: base
          path: |
            serpens-stage-x86_64.tar.gz
            flexura-x86_64-linux
            ebuild2flx-x86_64-linux
            sha256sums.txt
          retention-days: 7

  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison cpio xorriso grub-pc-bin grub-efi-amd64-bin mtools file qemu-system-x86 libelf-dev

      - name: build
        run: cargo build --release

      - name: stage tarball
        run: scripts/mkstage.sh serpens-stage-x86_64.tar.gz --pkgs "serpens-base serpens-boot busybox bash coreutils ncurses readline zlib linux grub"

      - name: live iso
        run: scripts/mkiso.sh serpens-stage-x86_64.tar.gz serpens-live-x86_64.iso

      - name: boot test
        run: |
          xorriso -osirrox on -indev serpens-live-x86_64.iso -extract /boot /tmp/isoboot
          set +e
          HK=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          echo "host kernel: $HK"
          echo "===== TEST A: host kernel, minimal qemu ====="
          rm -f a.log
          timeout 60 qemu-system-x86_64 -m 1024 -accel tcg -nographic \
            -kernel "$HK" -append "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200,keep panic=-1" \
            > a.log 2>&1
          echo "qemu exit: $?"
          tail -c 2000 a.log | tr -d '\r'
          sudo dmesg | tail -4
          echo "===== TEST B: our kernel, minimal qemu ====="
          rm -f b.log
          timeout 60 qemu-system-x86_64 -m 2048 -accel tcg -nographic \
            -kernel /tmp/isoboot/vmlinuz-serpens -initrd /tmp/isoboot/initramfs.cpio.gz \
            -append "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200,keep panic=-1" \
            > b.log 2>&1
          echo "qemu exit: $?"
          tail -c 3000 b.log | tr -d '\r'
          sudo dmesg | tail -4
          echo "===== TEST C: product path, grub from cdrom ====="
          rm -f serial.log debug.log
          timeout 360 qemu-system-x86_64 -m 2048 -smp 2 -accel tcg \
            -display none -monitor none \
            -serial file:serial.log \
            -debugcon file:debug.log -global isa-debugcon.iobase=0x402 \
            -no-reboot -cdrom serpens-live-x86_64.iso &
          QPID=$!
          for i in $(seq 1 72); do
            sleep 5
            if grep -q "login:" serial.log 2>/dev/null; then
              echo "login prompt after $((i*5))s"
              break
            fi
            kill -0 $QPID 2>/dev/null || { echo "qemu died at $((i*5))s"; break; }
          done
          kill $QPID 2>/dev/null
          wait $QPID
          echo "qemu exit: $?"
          tail -c 6000 serial.log | tr -d '\r' || true
          sudo dmesg | tail -4
          set -e
          grep -q "login:" serial.log 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-debug
          path: |
            serial.log
            debug.log
            a.log
            b.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso
          path: serpens-live-x86_64.iso
          retention-days: 7

  publish:
    needs: [build, iso]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: base

      - uses: actions/download-artifact@v4
        with:
          name: iso

      - name: checksums
        run: sha256sum serpens-live-x86_64.iso >> sha256sums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Serpens $GITHUB_REF_NAME" \
            --generate-notes \
            serpens-stage-x86_64.tar.gz \
            flexura-x86_64-linux \
            ebuild2flx-x86_64-linux \
            serpens-live-x86_64.iso \
            sha256sums.txt
