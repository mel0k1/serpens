[package]
name = "flexura"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Serpens package manager"
authors = ["mel0k1"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[profile.release]
opt-level = 2
